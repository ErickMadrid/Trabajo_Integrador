<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de registro - Mi web</title>
</head>
<body>

    <h1>Formulario de registro</h1>

    <form action="" method="get">
        
        <!-- Nombre -->
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
        </p>

        <!-- Apellidos -->
        <p>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos">
        </p>

        <!-- Sexo -->
        <p>
            Sexo:
            <input type="radio" id="hombre" name="sexo" value="hombre">
            <label for="hombre">Hombre</label>
            <input type="radio" id="mujer" name="sexo" value="mujer">
            <label for="mujer">Mujer</label>
        </p>

        <!-- Correo electrónico -->
        <p>
            <label for="email">Correo electrónico:</label>
            <input type="text" id="email" name="email">
        </p>

        <!-- Casilla novedades (activada por defecto) -->
        <p>
            <input type="checkbox" id="novedades" name="novedades" checked>
            <label for="novedades">Deseo recibir información sobre novedades y ofertas</label>
        </p>

        <!-- Casilla condiciones -->
        <p>
            <input type="checkbox" id="condiciones" name="condiciones">
            <label for="condiciones">Declaro haber leído y aceptar las condiciones generales del programa y la normativa sobre protección de datos</label>
        </p>

        <!-- Vínculo con las condiciones generales -->
        <p>
            <a href="condiciones.html" target="_blank">Ver condiciones generales</a>
        </p>

        <!-- Selección de país (Sudamérica, Argentina por defecto) -->
        <p>
            <label for="pais">País:</label>
            <select id="pais" name="pais">
                <option value="argentina" selected>Argentina</option>
                <option value="bolivia">Bolivia</option>
                <option value="brasil">Brasil</option>
                <option value="chile">Chile</option>
                <option value="colombia">Colombia</option>
                <option value="ecuador">Ecuador</option>
                <option value="guyana">Guyana</option>
                <option value="paraguay">Paraguay</option>
                <option value="peru">Perú</option>
                <option value="surinam">Surinam</option>
                <option value="uruguay">Uruguay</option>
                <option value="venezuela">Venezuela</option>
            </select>
        </p>

        <!-- Contraseñas (ocultas) -->
        <p>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password">
        </p>
        <p>
            <label for="repetir_password">Repetir contraseña:</label>
            <input type="password" id="repetir_password" name="repetir_password">
        </p>

        <!-- Estado Civil (Soltero por defecto) -->
        <p>
            <label for="estado_civil">Estado Civil:</label>
            <select id="estado_civil" name="estado_civil">
                <option value="soltero" selected>Soltero/a</option>
                <option value="casado">Casado/a</option>
                <option value="divorciado">Divorciado/a</option>
                <option value="viudo">Viudo/a</option>
            </select>
        </p>

        <!-- Dirección segmentada -->
        <fieldset>
            <legend>Dirección</legend>
            <p>
                <label for="provincia">Provincia:</label>
                <input type="text" id="provincia" name="provincia">
            </p>
            <p>
                <label for="localidad">Localidad:</label>
                <input type="text" id="localidad" name="localidad">
            </p>
            <p>
                <label for="calle">Dirección (Calle):</label>
                <input type="text" id="calle" name="calle">
            </p>
            <p>
                <label for="numero">Número:</label>
                <input type="text" id="numero" name="numero">
            </p>
            <p>
                <label for="departamento">Departamento:</label>
                <input type="text" id="departamento" name="departamento">
            </p>
        </fieldset>

        <!-- Botón de envío -->
        <p>
            <input type="submit" value="Enviar">
        </p>

    </form>

</body>
</html>
